# Builds the static front end and publishes it to the `gh-pages` branch, which GitHub Pages
# serves at https://<owner>.github.io/<repo>/. The backend (FastAPI + MedGemma) is not deployed
# here; the app asks for its address under "Server settings".
#
# If the site shows 404 after the first run, enable Pages once in the repository settings:
# Settings -> Pages -> Build and deployment -> Source "Deploy from a branch" -> gh-pages / (root).
name: Deploy front end to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build static site
        working-directory: frontend
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_STATIC: "1"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_API_BASE: ${{ vars.ANNA_API_BASE }}
        run: npm run build
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/out
          force_orphan: true
          commit_message: "Static front end build from ${{ github.sha }}"
